[workspace]
name = "guide-template"
version = "0.1.0"
description = "Template repository for single-document beginner-guide PDF projects (pandoc + WeasyPrint, with content-identicalness regression harness)."
channels = ["conda-forge"]
# Cross-platform Notes: the harness uses Pillow (pure Python + native wheels
# on every platform) so `make verify` *runs* on macOS / Linux / Windows.
# But strict pixel-exact rendering does NOT reproduce across machines —
# HarfBuzz/Cairo/FreeType differences (across OSes, and even across
# macOS minor versions with different bundled font versions) shift glyph
# positions enough to fail the zero-tolerance pixel diff. The repo
# ships system-font stacks (no bundled fonts), and CI is build-smoke
# only (Ubuntu only, to save Actions minutes — see CLAUDE.md "CI policy").
# Local pre-push `make verify` against the committed reference PDF
# (`<slug>.pdf` at the repo root) is the sole real gate for regressions.
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
# All deps are pinned to a major-version range. The verify harness is
# content-pixel-exact at zero tolerance, so a casual `pixi update` that
# bumps a major version can silently change rendering and break verify.
# Major-bounded ranges let minor + patch updates through (typically safe)
# but prevent the kind of cross-major jump that would force a baseline
# refresh nobody planned. pixi.lock pins the actual installed versions.
# Floor raised from >=3.10 to >=3.11 so stdlib `tomllib` (the only reader of
# guide.toml, via kitconfig.py) is always available — no `tomli` shim needed
# (plan.md:57). Still major-bounded below 3.15 by family convention.
python = ">=3.11,<3.15"
pandoc = ">=3,<4"
weasyprint = ">=60,<70"
# Harness toolchain: poppler provides pdfinfo / pdftotext / pdftoppm;
# pillow does the per-page pixel diff; qpdf canonicalizes PDF metadata for
# deterministic re-rendering.
poppler = ">=24,<26"
pillow = ">=10,<12"
qpdf = ">=11,<13"
[tasks]
build = "python build.py"
html = "python build.py --html-preview"
# web builds the opt-in website into app/dist/. No-ops cleanly (exit 0) on a
# PDF-only fork that has no style-screen.css — see build.py build_web().
web = "python build.py --web"
# release.py is invoked via `make release MSG="..."` (not a pixi task,
# because the Makefile target enforces the required MSG argument with a
# clear usage message).

# ----- Kit-only test environment -----
# pytest and the `test` task deliberately live in a KIT-ONLY feature, NOT in
# root [dependencies]/[tasks]. Root deps must stay byte-identical across the
# guide family — they template into every target's pixi.toml — so a target
# receives neither pytest nor a `test` task and never regenerates its lockfile
# merely because the kit gained a test runner (plan.md:89, :90). Only
# guide-template's own `kit` environment carries the suite. The target-shape
# renderer (Phase 5) drops kit-only features; test_kit_only_test_dependency
# asserts the placement that guarantee relies on.
[feature.kit.dependencies]
pytest = ">=8,<9"

[feature.kit.tasks]
test = "pytest tests/ -q"

# The default environment (root feature) is implicit and unchanged; `kit` layers
# the test feature on top of it so the suite has python + the kit modules.
[environments]
kit = ["kit"]
