[workspace]
name = "guide-template"
version = "0.1.0"
# kit-only:begin
# NOTE (kit maintainers): the description below must stay byte-identical to
# guide.toml's DESCRIPTION. `templated` rendering substitutes the kit's
# guide.toml VALUES with the target's, so a hand-written variant here cannot be
# matched and would propagate the kit's own description into every converged
# guide. This note is itself kit-only — a target's pixi.toml is overwritten by
# sync, so the instruction has no addressee there.
# kit-only:end
description = "Template repository for single-document beginner-guide PDF projects. Licensed under Creative Commons Attribution 4.0 International (CC BY 4.0): https://creativecommons.org/licenses/by/4.0/"
channels = ["conda-forge"]
# `make verify` is a STALENESS check — does the committed reference PDF's embedded
# stamp match a fresh content hash over SOURCE_FILES? — with no rendering and no
# pixel comparison, so it is platform-independent and runs anywhere including CI.
# The old pixel-exact harness (which did NOT reproduce across machines, and so
# pinned CI to build-smoke only) has been removed. `make verify-render` is a
# separate canonical-host-only canary that builds and compares page count +
# stamp-excluded text; it is never wired into CI. The repo ships system-font
# stacks (no bundled fonts), so a rendered PDF still varies by host — which is why
# reference PDFs are generated on one canonical host (guide.toml's baseline_platform).
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
# All deps are pinned to a major-version range; pixi.lock pins the actual
# installed versions. Major-bounded ranges let minor + patch updates through
# (typically safe) but prevent a cross-major jump; a lock change can still shift
# rendering, which `make verify-render` (canonical host) is there to catch.
# Floor raised from >=3.10 to >=3.11 so stdlib `tomllib` (the only reader of
# guide.toml, via kitconfig.py) is always available — no `tomli` shim needed
# (plan.md:57). Still major-bounded below 3.15 by family convention.
python = ">=3.11,<3.15"
pandoc = ">=3,<4"
weasyprint = ">=60,<70"
# Harness toolchain: poppler provides pdfinfo / pdftotext (the staleness check
# and the render canary); qpdf canonicalizes PDF metadata for deterministic
# re-rendering. (pillow was dropped with the pixel diff, and pdftoppm is no
# longer used.)
poppler = ">=24,<26"
qpdf = ">=11,<13"
[tasks]
build = "python build.py"
html = "python build.py --html-preview"
# web builds the opt-in website into app/dist/. No-ops cleanly (exit 0) on a
# PDF-only fork that has no style-screen.css — see build.py build_web().
web = "python build.py --web"
# release.py is invoked via `make release MSG="..."` (not a pixi task,
# because the Makefile target enforces the required MSG argument with a
# clear usage message).

# kit-only:begin
# ----- Kit-only test environment -----
# Everything between the surrounding sentinel comments exists ONLY in the kit.
# sync.py's _strip_kit_only() removes this whole block when rendering pixi.toml
# into a target, so a target's pixi.toml never declares pytest, the `test` task,
# or a `kit` environment — and its pixi.lock therefore never gains a `kit` env
# or regenerates merely because the kit gained a test runner (plan.md:89, :90).
#
# Placement alone is NOT enough: these sections are outside root
# [dependencies]/[tasks], but `templated` rendering copies the whole file, so
# before the sentinels existed they reached every target verbatim. The sentinels
# are what actually enforces it; test_kit_only_test_dependency asserts the
# placement, and test_kit_only_region asserts the stripping.
#
# NOTE: never write either sentinel literally in prose — a stray occurrence is
# parsed as a real marker and unbalances the block.
[feature.kit.dependencies]
pytest = ">=8,<9"
# pyyaml: the kit suite parses the workflow YAML to assert CI's contract (runs
# `make verify`, never `make verify-render`; reference PDF in the paths filter).
# Kit-only, like pytest — it never templates into a target's pixi.toml.
pyyaml = ">=6,<7"

[feature.kit.tasks]
test = "pytest tests/ -q"

# The default environment (root feature) is implicit and unchanged; `kit` layers
# the test feature on top of it so the suite has python + the kit modules.
[environments]
kit = ["kit"]
# kit-only:end
