name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new commit comes in. Keeps PR
# iteration loops snappy and saves CI minutes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Don't cancel sibling jobs when one platform fails — the diff PNGs
      # from each are useful even if e.g. windows blows up while macos passes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Bash everywhere (incl. windows via git-bash) so the Makefile's
        # awk-based OUTPUT_SLUG scrape works on every runner.
        shell: bash
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history so build.py's version stamp (derived from git log
          # / git status of SOURCE_FILES) matches what a local build sees.
          # Without this, the stamp would carry the shallow-clone's HEAD
          # date, and verify would diff against the baseline cleanly only
          # by coincidence.
          fetch-depth: 0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # The committed pixi.lock pins exact versions for reproducible
          # rendering. The verify harness is content-pixel-exact at zero
          # tolerance — a WeasyPrint or font-package version drift here
          # would cause every PR to fail spuriously. Bundled liberation-fonts
          # ensures the rendered glyphs are identical across macOS / Linux /
          # Windows runners.
          cache: true
          frozen: true

      - name: make verify
        run: make verify

      - name: Upload diff PNGs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-diff-${{ matrix.os }}
          path: verify-diff/
          if-no-files-found: ignore
          retention-days: 7
