name: verify

# Build-smoke CI. Runs `make` (PDF) + `make web` (site) to catch
# "the pipeline crashes" regressions. Does NOT run `make verify` — the strict
# pixel-exact harness only reproduces on one canonical machine, so local
# pre-push `make verify` is the real regression gate (see CLAUDE.md "CI policy").
#
# Cost controls (deliberate):
#   * Ubuntu only. macOS runners bill at 10x and Windows at 2x the Linux rate;
#     the cross-platform smoke rarely caught anything the Ubuntu run didn't.
#     Re-add a matrix here if cross-platform breakage ever becomes a real risk.
#   * paths filters. Doc-only / plan-only pushes (README, CLAUDE.md, LICENSE,
#     plans/, .gitignore) don't change either rendered output, so they skip CI.

on:
  push:
    branches: [main]
    paths:
      - 'guide.md'
      - 'style.css'
      - 'style-screen.css'
      - 'build.py'
      - 'transforms.py'
      - 'verify_pdf.py'
      - 'Makefile'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'app/**'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'guide.md'
      - 'style.css'
      - 'style-screen.css'
      - 'build.py'
      - 'transforms.py'
      - 'verify_pdf.py'
      - 'Makefile'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'app/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new commit comes in. Keeps PR
# iteration loops snappy and saves CI minutes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # Bash so the Makefile's awk-based OUTPUT_SLUG scrape works.
        shell: bash
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history so build.py's version stamp (derived from git log
          # / git status of SOURCE_FILES) matches what a local build sees.
          # Without this, the stamp would carry the shallow-clone's HEAD
          # date, and verify would diff against the baseline cleanly only
          # by coincidence.
          fetch-depth: 0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # pixi.lock pins exact versions per-platform for reproducible
          # rendering. Don't run `pixi update` from CI — let major-bound
          # changes happen via local PRs that refresh the committed reference PDF too.
          cache: true
          frozen: true

      # PDF build smoke — catches "the pipeline crashes" regressions.
      - name: make (PDF build smoke)
        run: make

      # Web build smoke — confirm `make web` produces a nonzero index.html.
      # (Guarded: skips cleanly on PDF-only forks that haven't enabled the web
      # layer, where the `web` target / app/ scaffold don't exist yet.)
      - name: make web (web build smoke)
        run: |
          if make -n web >/dev/null 2>&1; then
            make web
            test -s app/dist/index.html || { echo "app/dist/index.html missing or empty"; exit 1; }
            echo "web build smoke OK"
          else
            echo "no 'web' target — PDF-only fork; skipping web smoke"
          fi
