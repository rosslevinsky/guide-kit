name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new commit comes in. Keeps PR
# iteration loops snappy and saves CI minutes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Don't cancel sibling jobs when one platform fails — the diff PNGs
      # from each are useful even if e.g. windows blows up while macos passes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Bash everywhere (incl. windows via git-bash) so the Makefile's
        # awk-based OUTPUT_SLUG scrape works on every runner.
        shell: bash
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history so build.py's version stamp (derived from git log
          # / git status of SOURCE_FILES) matches what a local build sees.
          # Without this, the stamp would carry the shallow-clone's HEAD
          # date, and verify would diff against the baseline cleanly only
          # by coincidence.
          fetch-depth: 0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # pixi.lock pins exact versions per-platform for reproducible
          # rendering. Don't run `pixi update` from CI — let major-bound
          # changes happen via local PRs that refresh `baseline.pdf` too.
          cache: true
          frozen: true

      # Build runs everywhere — catches "the pipeline crashes" regressions
      # on the non-canonical platforms without claiming pixel-identical
      # output. macOS-only `make verify` below is what catches real
      # rendering regressions.
      - name: make (build smoke)
        run: make

      - name: make verify (macOS only — strict pixel match)
        # HarfBuzz / Cairo / FreeType differ across OSes; the same font
        # file renders subtly different glyph positions per platform. The
        # strict pixel-exact harness only makes sense against a baseline
        # rendered on the same platform. macOS is the canonical platform
        # for this repo's baseline.pdf.
        if: matrix.os == 'macos-latest'
        run: make verify

      - name: Upload diff PNGs on failure
        if: failure() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: verify-diff-${{ matrix.os }}
          path: verify-diff/
          if-no-files-found: ignore
          retention-days: 7
