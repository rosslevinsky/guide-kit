name: verify

# CI (Ubuntu) runs: the kit test suite, `make verify` (the platform-independent
# STALENESS check — is the committed reference PDF up to date with the source?),
# and `make` / `make web` build smoke. It NEVER runs `make verify-render`, which
# builds and is platform-sensitive (font substitution shifts line wrapping) — that
# canary is a canonical-host command only. The old "CI is build-smoke only because
# the pixel harness doesn't reproduce across machines" rule no longer applies: the
# pixel check is gone and the staleness check reproduces everywhere.
#
# Cost controls (deliberate):
#   * Ubuntu only. macOS runners bill at 10x and Windows at 2x the Linux rate.
#   * paths filters. Doc-only / plan-only pushes (README, CLAUDE.md, LICENSE,
#     plans/, .gitignore) change no rendered output, so they skip CI. The root
#     reference PDF (`*.pdf`) IS filtered in: a commit touching only the
#     reader-facing deliverable must still be gated by the staleness check.

on:
  push:
    branches: [main]
    paths:
      - 'guide.md'
      - 'style.css'
      - 'style-screen.css'
      - 'build.py'
      - 'transforms.py'
      - 'verify_pdf.py'
      - 'baseline.py'
      - 'release.py'
      - 'bootstrap.py'
      - 'Makefile'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'app/**'
      - 'guide.toml'
      - 'kitconfig.py'
      - 'kit-manifest.toml'
      - 'kitmanifest.py'
      - 'sync.py'
      - 'tests/**'
      - '*.pdf'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'guide.md'
      - 'style.css'
      - 'style-screen.css'
      - 'build.py'
      - 'transforms.py'
      - 'verify_pdf.py'
      - 'baseline.py'
      - 'release.py'
      - 'bootstrap.py'
      - 'Makefile'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'app/**'
      - 'guide.toml'
      - 'kitconfig.py'
      - 'kit-manifest.toml'
      - 'kitmanifest.py'
      - 'sync.py'
      - 'tests/**'
      - '*.pdf'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

# Least privilege, plus exactly what the auto-baseline step needs.
# `actions: write` is required to dispatch baseline.yml; without it the dispatch
# fails and the step's error annotation tells the operator to run it by hand.
# `contents: read` only — this workflow never writes to the repo. The refreshed
# reference PDF is committed by baseline.yml, which declares its own
# `contents: write`.
permissions:
  contents: read
  actions: write

# Cancel in-flight runs on the same ref when a new commit comes in. Keeps PR
# iteration loops snappy and saves CI minutes.
#
# NOTE the interaction with auto-baseline: cancel-in-progress can kill a verify
# run before it dispatches. That is safe rather than lossy — the newer commit
# that caused the cancellation runs its own verify, and if the reference is still
# stale that run dispatches instead. The dispatch is tied to the staleness of the
# tree, not to any single run surviving.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # Bash so the Makefile's awk-based OUTPUT_SLUG scrape works.
        shell: bash
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history so build.py's version stamp (derived from git log
          # / git status of SOURCE_FILES) matches what a local build sees.
          # Without this, the stamp would carry the shallow-clone's HEAD
          # date, and verify would diff against the baseline cleanly only
          # by coincidence.
          fetch-depth: 0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # pixi.lock pins exact versions per-platform for reproducible
          # rendering. Don't run `pixi update` from CI — let major-bound
          # changes happen via local PRs that refresh the committed reference PDF too.
          cache: true
          frozen: true

      # Kit test suite — one shared shape for the kit and all seven targets. The
      # kit (the template repo — no `.template-version`) runs its OWN pixi `kit` env.
      # A sync target has no `kit` env (pytest is a kit-only feature that never
      # templates in), so it borrows the kit's env by checking the kit out to
      # _kit/ and pointing pixi at its manifest. TWO INDEPENDENT guards — do not
      # conflate them:
      #   * checkout is guarded on `.template-version` EXISTING — only a target
      #     needs to borrow the runner; the kit is the source and never has one.
      #   * the test run is guarded on `tests/` EXISTING — true for the kit and for
      #     five of seven targets; the rest skip rather than fail on empty collection.
      # `.template-version` lands in targets in Phase 6, so the target branch is
      # inert in the kit today; the kit branch works from Phase 1 onward.
      - name: Resolve kit repo (targets only)
        id: kit
        if: hashFiles('.template-version') != ''
        run: |
          # source_repo is the upstream kit a target borrows its test runner from.
          # .template-version is a JSON structured record (finalized in Phase 6).
          SRC=$(python3 -c "import json; print(json.load(open('.template-version'))['source_repo'])")
          echo "source_repo=$SRC" >> "$GITHUB_OUTPUT"
          # Pin the borrowed runner to the kit version this guide actually
          # adopted. Without a ref the checkout takes the kit's default-branch
          # HEAD, so tightening a shared assertion in the kit turns every guide
          # red at once with no commit in any of them, and a guide can never
          # reproduce yesterday's CI. This matters more now that the kit holds
          # shared assertion LOGIC (tests/topic_coverage.py), not just a runner.
          # MUST be a full 40-char commit SHA, a tag, or a branch name.
          # actions/checkout's `ref:` resolves branches and tags and accepts a
          # FULL commit SHA — a SHORT SHA fails outright with "A branch or tag
          # with the name '<sha>' could not be found", which is how this was
          # found. Anything recording kit_version must write the full SHA.
          KITV=$(python3 -c "import json; print(json.load(open('.template-version')).get('kit_version') or '')")
          case "$KITV" in
            ????????????????????????????????????????) : ;;   # full 40-char SHA — fine
            "") : ;;                                          # absent — default branch
            *)
              # A short SHA or unknown ref would fail the checkout below and take
              # the whole verify run red. Fall back to the default branch and say
              # so, rather than failing a guide's CI over its own metadata.
              echo "::warning::kit_version '$KITV' is not a full commit SHA; borrowing the kit's default branch instead"
              KITV="" ;;
          esac
          echo "kit_version=$KITV" >> "$GITHUB_OUTPUT"

      - name: Check out kit test runner (targets only)
        if: steps.kit.outputs.source_repo != '' && hashFiles('tests/**') != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.kit.outputs.source_repo }}
          # Empty ref falls back to the default branch, which is the right
          # behaviour for a guide whose record predates kit_version.
          ref: ${{ steps.kit.outputs.kit_version }}
          path: _kit
          fetch-depth: 0

      - name: kit test suite
        if: hashFiles('tests/**') != ''
        run: |
          if [ -f .template-version ]; then
            # pixi runs from the manifest's workspace root (_kit), so a bare
            # `tests/` would resolve to _kit/tests (the KIT's suite). Use the
            # absolute path to THIS repo's tests so the TARGET's own tests run in
            # the borrowed kit env; the target's tests/conftest.py puts the target
            # root on sys.path, so its modules import correctly.
            pixi run --manifest-path _kit/pixi.toml -e kit pytest "$GITHUB_WORKSPACE/tests" -q
          else
            pixi run -e kit test
          fi

      # PDF build smoke — catches "the pipeline crashes" regressions.
      - name: make (PDF build smoke)
        run: make

      # Web build smoke — confirm `make web` produces a nonzero index.html. Gated
      # on web ENABLED (style-screen.css present) AND a reference PDF present:
      # build_web() now HARD-FAILS on a missing reference PDF (no more 404 download
      # link), and a web-enabled guide has zero root PDFs from bootstrap until its
      # first canonical-host release — so without the reference-PDF guard its CI
      # would be red across that whole pre-first-release window. Skip with a notice.
      - name: make web (web build smoke)
        run: |
          SLUG=$(awk -F'"' '/^OUTPUT_SLUG[[:space:]]*=/{print $2; exit}' guide.toml)
          if [ ! -f style-screen.css ]; then
            echo "web layer not enabled (no style-screen.css); skipping web smoke"
          elif [ ! -f "$SLUG.pdf" ]; then
            echo "pre-first-release — no reference PDF ($SLUG.pdf) yet; web smoke skipped"
          else
            make web
            test -s app/dist/index.html || { echo "app/dist/index.html missing or empty"; exit 1; }
            echo "web build smoke OK"
          fi

      # Smoke-check the COMMITTED reference PDF: does the file readers download
      # actually look like a finished guide? Platform-independent and build-free,
      # so unlike `make verify-render` this is CI-safe. Skipped pre-first-release,
      # where there is legitimately no reference PDF yet.
      #
      # Runs BEFORE the staleness gate on purpose. A stale reference is still a
      # real PDF worth checking, and if both are wrong an operator should see
      # both in one round rather than fix the stamp and only then discover the
      # render is broken.
      - name: make smoke (does the reference PDF look like a guide?)
        run: |
          set -euo pipefail
          SLUG=$(awk -F'"' '/^OUTPUT_SLUG[[:space:]]*=/{print $2; exit}' guide.toml)
          if [ -f "$SLUG.pdf" ]; then
            make smoke
          else
            echo "::notice::pre-first-release — no reference PDF ($SLUG.pdf) yet; nothing to smoke-check"
          fi

      # Staleness gate — is the committed reference PDF up to date with the source?
      # Platform-independent (no build, no render), so it runs in CI for the first
      # time. CI runs `make verify` and NEVER `make verify-render` (which builds and
      # is platform-sensitive — a canonical-host-only canary). Run LAST so the
      # build-smoke signal is still visible on a legitimately-stale (red) round.
      #
      # `continue-on-error` is NOT used and the outcome is NOT swallowed: a stale
      # reference genuinely IS a failure at this commit, and the auto-baseline
      # step below repairs it by pushing a NEW commit. Suppressing the red here
      # would mean a silent pass whenever the dispatch itself failed.
      - name: make verify (staleness check)
        id: staleness
        # Call the checker DIRECTLY rather than through make: GNU make normalizes
        # any recipe failure to exit 2, which would make "stale" (1) and
        # "environment broken" (2) indistinguishable — the exact confusion that
        # once made baseline.yml refuse to render on a plainly stale reference.
        run: |
          set +e
          pixi run python verify_pdf.py --staleness
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # ── Auto-baseline: rebuild the reference PDF when a content push made it
      #    stale ───────────────────────────────────────────────────────────────
      #
      # WHY THIS EXISTS. Before this, editing guide.md and pushing left the branch
      # red and the deployed site quietly serving the OLD PDF until someone
      # remembered to run `gh workflow run baseline.yml` by hand. That is the
      # family's most-repeated defect shape — a check nobody acts on plus a stale
      # live artifact — and it was load-bearing on human memory.
      #
      # The historical argument for keeping it manual was that `make baseline`
      # re-blesses whatever renders without anyone looking. That argument died
      # when the macOS handoff moved into CI: baseline.yml already renders and
      # commits unattended, so a manual DISPATCH bought no inspection, only
      # delay. The inspection is now the `make smoke` step inside baseline.yml,
      # which aborts before committing a bad render.
      #
      # Guards:
      #   * only on a push to the default branch — a PR must not trigger a macOS
      #     render, and could not push the result anyway
      #   * only on rc == 1 (genuinely stale). rc == 2 is an environment error, and
      #     rendering a baseline on the strength of a broken check is how a wrong
      #     PDF would get blessed
      #   * only if baseline.yml exists
      #
      # Termination: baseline.yml commits the refreshed PDF, which is a push
      # touching '*.pdf', which re-runs this workflow — now fresh, so rc == 0 and
      # no further dispatch. If a render can never satisfy the stamp, baseline's
      # own "no change to commit" path stops the chain instead of looping.
      - name: Rebuild the reference PDF (auto-dispatch baseline)
        if: >-
          failure()
          && steps.staleness.outputs.rc == '1'
          && github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # REF is passed through env: rather than interpolated into the shell body,
        # because git permits ;, `, $, (, ), &, | and " in branch names. This note
        # lives HERE, as a YAML comment, and NOT inside the run: block below —
        # GitHub evaluates expression syntax anywhere in a run: value, INCLUDING
        # inside shell comments, so writing the literal expression delimiters in
        # that prose makes them an empty expression and invalidates the whole
        # workflow file. That is exactly how this step first shipped broken.
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          if [ ! -f .github/workflows/baseline.yml ]; then
            echo "::warning::reference PDF is stale and there is no baseline.yml to rebuild it"
            exit 0
          fi
          if gh workflow run baseline.yml --ref "$REF" \
               -f message="baseline: auto-refresh reference PDF (stale after push)"; then
            echo "::notice::reference PDF was stale — dispatched baseline.yml to re-render it on macOS. This run stays red; the commit it pushes will be green."
          else
            echo "::error::reference PDF is stale and dispatching baseline.yml FAILED — run 'gh workflow run baseline.yml' by hand, or the site keeps serving the old PDF"
          fi
