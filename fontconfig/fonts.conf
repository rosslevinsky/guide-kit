<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The kit's HERMETIC Fontconfig environment.

  WHY THIS EXISTS. Bundling the faces and writing a careful CSS cascade is not
  enough on its own: WeasyPrint delegates font matching and fallback to
  Pango/Fontconfig, and Fontconfig answers from the HOST's font set. Measured on
  an ordinary Linux box before this file existed, `fc-match 'Source Serif 4'`
  returned /usr/share/fonts/.../DejaVuSans.ttf — a host font, standing in for a
  family the repository ships. Any glyph the cascade does not nail down, and
  every fallback, could therefore come from whatever happened to be installed.

  This config is a TEMPLATE. `buildcore.hermetic_fontconfig()` resolves
  __FONT_DIR__ and __CACHE_DIR__ to absolute paths and writes the result under
  build/, because Fontconfig has no portable way to spell "relative to the
  repository root" and a checked-in absolute path would be wrong on every other
  machine.

  It is deliberately NOT a filter over the system configuration: it replaces it.
  There is no <include> of /etc/fonts, so nothing the host installs is reachable.
-->
<fontconfig>
  <!-- The ONLY directory scanned. Not an addition to the system list — the
       system list is never included, so this is the whole font universe. -->
  <dir>__FONT_DIR__</dir>
  <!-- Target-owned generated subsets (tools/subset-cjk.py). Scanned so a guide
       that subsets a CJK face can actually render it. -->
  <dir>__GENERATED_DIR__</dir>

  <!-- An isolated cache, inside build/. Sharing the user's ~/.cache/fontconfig
       would let a cache built against the host's fonts answer queries here, which
       is the same leak by a slower route. -->
  <cachedir>__CACHE_DIR__</cachedir>

  <!-- No host directories, stated explicitly rather than by omission so that a
       future edit adding one is a visible change. -->
  <rejectfont>
    <glob>/usr/share/fonts/*</glob>
    <glob>/usr/local/share/fonts/*</glob>
    <glob>/Library/Fonts/*</glob>
    <glob>/System/Library/Fonts/*</glob>
    <glob>~/.fonts/*</glob>
    <glob>~/.local/share/fonts/*</glob>
  </rejectfont>

  <!-- Deterministic generic-family resolution, so an unstyled element or a
       fallback lands on a bundled face rather than on Fontconfig's opinion. -->
  <!-- NO GENERIC-FAMILY ALIASES, and that is a measured decision rather than an
       omission. On fontconfig 2.15 a config that does not include the system's
       generic definitions cannot rebind `sans-serif` at all: `<alias><prefer>`,
       `<alias binding="same">` and a strong `<match target="pattern">` prepend
       were each tried and NONE fired — verified with a control, where the same
       `<match>` syntax redirected a non-generic family name correctly. Generic
       names are intercepted by built-in `genericfamily` handling that the
       excluded system config supplies.

       Nothing is lost that matters here. The property this file exists for is
       that no HOST font is reachable, and that holds for generics too: with only
       this directory scanned, `sans-serif` resolves to a bundled face. Which
       bundled face is not controllable by this route, so the kit does not
       pretend otherwise — the stylesheets name concrete families through
       @font-face and never rely on a generic. `assert_hermetic_fontconfig()`
       checks the generics anyway, because "resolves inside fonts/vendor" is the
       claim being made and it is the one worth enforcing. -->

  <!-- Synthetic emboldening and slanting OFF. They are the mechanism by which a
       missing weight silently becomes a fake one; with them off, a missing face
       is a visible failure instead of a quiet approximation. -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="matrix" mode="assign"><matrix><double>1</double><double>0</double><double>0</double><double>1</double></matrix></edit>
  </match>
</fontconfig>
