# test_manifest_roles' exhaustiveness rule satisfied without sync ever writing
# it.
path = "templates/hub/hub-template.html"
lifecycle = "bootstrap-source"
projects_to = "hub-template.html"
policy = "never"

[[entry]]
# The hub's editorial data — which guides, sections, order, badges, blurbs. It
