[[entry]]
# The three ASSET namespaces. Target-owned (`never`): a guide's images are its
# own, exactly as its style-screen.css is, and the kit ships none.
#
# SIBLINGS, never nested — the same rule `fonts/vendor` and `fonts/generated`
# follow. Nested, the enclosing tree's expansion can erase the inner one; here it
# would also put a screen-only image into the PDF's closure, which is the single
# thing the split exists to prevent.
#
#   assets/shared/**  both outputs        assets/print/**  the PDF only
#   assets/web/**     the site only
path = "templates/assets/shared/.gitkeep"
lifecycle = "bootstrap-source"
projects_to = "assets/shared/.gitkeep"
policy = "never"

