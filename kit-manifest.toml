# --- identical: the theme layer ---
# Every theme ships to every guide, and a guide simply does not select the ones it
# is not using. `identical`, because a theme is the kit's definition of an
# appearance: a per-guide fork of one would make `theme.name` mean something
# different in each repository, which is exactly what naming an appearance is
# supposed to prevent. Per-guide adjustment is `[theme.tokens]` in guide.toml —
# the middle cascade layer — not an edited theme.
[[entry]]
path = "themes/**"
lifecycle = "retained-in-kit"
projects_to = "themes/**"
policy = "identical"

# --- identical: font tooling ---
# The subsetter is PROJECTED, not kit-only: its output lands in the target's own
# `fonts/generated/`, which is target-owned, so each guide runs it and owns the
# result. The kit ships the tool; it does not ship the subsets.
[[entry]]
path = "tools/subset-cjk.py"
lifecycle = "retained-in-kit"
projects_to = "tools/subset-cjk.py"
policy = "identical"

# --- identical: the hermetic font environment ---
# The Fontconfig TEMPLATE. Synced verbatim: font resolution must be the same
# question in every guide, and a per-guide fontconfig is exactly how one guide
# quietly starts rendering from the host's fonts. The RESOLVED copy (absolute
# paths substituted at build time) is written under build/ and never tracked.
[[entry]]
path = "fontconfig/fonts.conf"
lifecycle = "retained-in-kit"
projects_to = "fontconfig/fonts.conf"
policy = "identical"

# --- the bundled font faces, in TWO NON-NESTING namespaces ---
# A DIRECTORY-TREE projection. The faces were enumerated one entry per file,
# because sync resolved `projects_to` as a literal path and a glob destination
# made it try to read a file named "fonts/**" — so adding a face meant adding a
# line here in the same commit, the paired edit the glob was meant to avoid.
# sync.py projects trees now, so the enumeration is gone.
#
#   fonts/vendor/**     kit-owned upstream binaries + their licences, synced
#   fonts/generated/**  target-owned build output (subset faces), never written
#
# They are SIBLINGS, neither inside the other, and that is a correctness property
# rather than tidiness. While `fonts/**` was an outer namespace, a target-owned
# generated subset lived INSIDE a kit-managed tree, and the only things keeping a
# sync from erasing it were longest-match precedence and a carve-out in the
# deletion guard — two mechanisms holding back a mistake the layout can simply
# not permit.
#
# vendor/ is IDENTICAL, not `never` — the opposite of style.css. A guide owns its
# stylesheet, because typography choices are the guide's; it does not own the font
# BINARIES, because the point of bundling is that every guide renders from the
# same bytes.
[[entry]]
path = "fonts/vendor/**"
lifecycle = "retained-in-kit"
projects_to = "fonts/vendor/**"
policy = "identical"

# `generated` + `never`: a subset face is produced by the target's own build from
# the vendor faces, so the kit has no authoritative bytes for it and must neither
# write one nor delete one.
[[entry]]
path = "fonts/generated/**"
lifecycle = "generated"
projects_to = "fonts/generated/**"
policy = "never"


