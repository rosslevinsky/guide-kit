lifecycle = "retained-in-kit"

# The DOM test harness's node manifest and lockfile. Kit-only, and every part of
# that is deliberate:
#
#   * `tests/**` never syncs, so no target has `tests/nav_dom.js` to run and none
#     of them needs the dependency it imports.
#   * a target already has node dependencies under `app/` for the wrangler
#     wrapper; putting a SECOND package.json at a guide's root would collide with
#     that in every tool that walks upward looking for one.
#   * nothing here is in any artifact's closure — jsdom renders no PDF and no
#     page, it only reads one — so this cannot move a version stamp.
#
# `verify.yml` guards its `npm ci` on the ROOT lockfile existing, which is what
# keeps the step inert in the seven targets it is synced to.
[[entry]]
path = "package.json"
lifecycle = "retained-in-kit"

[[entry]]
path = "package-lock.json"
lifecycle = "retained-in-kit"

# Maintainer documentation ABOUT the family, not content for any one guide:
# docs/family-as-built.md is the decision record (what shipped, what diverged
# from plan, which defects were only ever caught by running things end to end).
# Kit-only, so `_prune_kit_only` deletes docs/ from a fork — a new guide has no
# use for the family's history and would publish it in its own repo.
#
# Glob, not a single path, so a second kit doc does not need a manifest edit
# (the exhaustiveness test would otherwise fail on the commit that adds it).
[[entry]]
path = "docs/**"
lifecycle = "retained-in-kit"

# CONTRIBUTING.md is about contributing to THE KIT — pixi, the suite, the manifest's
# own exhaustiveness rule, the re-baseline sequence. None of that is a guide's
# contribution process, which is "edit guide.md, push"; the README already covers it.
# So this is kit-only (no `projects_to`), which means `_prune_kit_only` removes it
# from a fork automatically and a guide never ships instructions for the wrong repo.
[[entry]]
path = "CONTRIBUTING.md"
lifecycle = "retained-in-kit"

# BREAKING.md is kit-only (no `projects_to`) for a reason that is easy to get
# backwards: it is the KIT's record, and `sync.py` reads it out of the kit
# checkout it runs from, never out of the target. Projecting it would put a copy
# in every guide that nothing reads and that goes stale the moment the kit gains
# an entry — and worse, would invite someone to edit the copy.
[[entry]]
path = "BREAKING.md"
lifecycle = "retained-in-kit"

